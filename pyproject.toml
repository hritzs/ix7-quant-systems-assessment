[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ix7-quant-systems-assessment"
version = "1.0.0"
description = "Live market data module and rate-limited trade order executor"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hritik Goel" }]
dependencies = ["websockets==15.0.1"]

[project.scripts]
market-data = "market_data.__main__:main"
tick-publisher = "market_data.publisher:main"
order-executor = "order_executor.__main__:main"

[tool.setuptools]
packages = ["market_data", "order_executor"]
